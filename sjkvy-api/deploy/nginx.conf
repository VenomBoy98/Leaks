# nginx reverse proxy for the SJKVY API.
# Terminates client traffic, forwards to the API on the internal network, sets the
# X-Forwarded-* headers the API trusts (TRUST_PROXY=true), and applies coarse limits.

# Rate limiting zone (defense-in-depth; the API also rate-limits per subject/IP).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream sjkvy_api {
  server api:8080;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  # Cap request bodies at the proxy too (API bodyLimit is 1MB; uploads are larger).
  client_max_body_size 12m;

  # --- HTTPS guidance ---------------------------------------------------------------
  # In production, terminate TLS here and redirect 80 -> 443:
  #   listen 443 ssl http2;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # Obtain certs via Let's Encrypt (certbot) or your platform's managed TLS. Never serve
  # tokens/JWTs over plain HTTP in production.

  # Health/readiness are cheap and unauthenticated; allow probes without rate limits.
  location = /health   { proxy_pass http://sjkvy_api; }
  location = /ready    { proxy_pass http://sjkvy_api; }

  # Metrics must NOT be public — restrict to the monitoring network/IP.
  location = /metrics {
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    deny all;
    proxy_pass http://sjkvy_api;
  }

  location / {
    limit_req zone=api burst=40 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;
    proxy_set_header Connection        "";
    proxy_pass http://sjkvy_api;
    proxy_read_timeout 30s;
  }
}
